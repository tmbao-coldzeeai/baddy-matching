version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: baddy-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - baddy-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: baddy-server
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/baddy-matching
    depends_on:
      - mongodb
    networks:
      - baddy-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: baddy-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - server
    networks:
      - baddy-network

volumes:
  mongodb_data:

networks:
  baddy-network:
    driver: bridge